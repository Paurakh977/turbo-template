x-proxy-base: &proxy-base
  image: nginx:1.27-alpine
  restart: unless-stopped
  command:
    [
      '/bin/sh',
      '-c',
      'sh /opt/nginx/entrypoint.sh && exec nginx -g "daemon off;"',
    ]
  environment:
    NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
    NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:?NGINX_SSL_CERT_FILENAME is required}
    NGINX_SSL_KEY_FILENAME: ${NGINX_SSL_KEY_FILENAME:?NGINX_SSL_KEY_FILENAME is required}
    # Real client IP for nginx rate limits. Direct mode now (127.0.0.0/8 no-op);
    # set NGINX_TRUSTED_PROXIES to your LB/CDN CIDRs when one is added later.
    NGINX_TRUSTED_PROXIES: ${NGINX_TRUSTED_PROXIES:-127.0.0.0/8}
    NGINX_REAL_IP_HEADER: ${NGINX_REAL_IP_HEADER:-X-Forwarded-For}
  ports:
    - '${PROXY_HTTP_PORT:?PROXY_HTTP_PORT is required}:80'
    - '${PROXY_HTTPS_PORT:?PROXY_HTTPS_PORT is required}:443'
  volumes:
    - ./nginx/nginx.conf:/opt/nginx/nginx.conf.template:ro
    - ./nginx/entrypoint.sh:/opt/nginx/entrypoint.sh:ro
    - ./nginx/certs:/etc/nginx/certs:ro
  healthcheck:
    test:
      ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1']
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 15s
  networks:
    app-network:
      aliases:
        - proxy

services:
  postgres:
    profiles: ['prod', 'dev', 'local']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    expose:
      - '5432'
    ports:
      # Loopback-only so host-side tools (pnpm db:seed, Prisma Studio) work;
      # nothing is reachable from external interfaces.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # MUST stay TCP-explicit (-h 127.0.0.1). Without -h, pg_isready talks
      # over the unix socket and can pass against the image's temporary init
      # server (socket-only) while TCP isn't bound yet — on fresh volumes
      # that marks postgres "healthy" before it accepts connections, and
      # migrate/api/web boot straight into ECONNREFUSED.
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      app-network:
        aliases:
          - postgres

  redis:
    profiles: ['prod', 'dev', 'local']
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - '6379'
    ports:
      # Loopback-only for host-side tools (redis-cli); external interfaces
      # stay closed.
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      app-network:
        aliases:
          - redis

  pgadmin:
    # Re-added to prod but locked down: credentials are REQUIRED (from your
    # .env) and the port is bound to 127.0.0.1 only, so it is never exposed to
    # the public internet. Access it via an SSH tunnel
    # (`ssh -L 5050:127.0.0.1:5050 <host>`) or `docker compose exec`.
    profiles: ['prod', 'dev', 'local']
    image: dpage/pgadmin4:8.11
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
    expose:
      - '80'
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - pgadmin

  migrate:
    profiles: ['prod']
    image: template-turbo-migrate:prod
    build:
      context: .
      dockerfile: apps/migrate/Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    networks:
      app-network:
        aliases:
          - migrate

  api:
    profiles: ['prod']
    image: template-turbo-api:prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
      target: runner
      args:
        TURBO_VERSION: '2.10.10'
        # NOTE: no DATABASE_URL build arg - the builder never opens a DB
        # connection, so credentials stay out of build cache/provenance.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: ${HOST:?HOST is required}
      PORT: ${PORT:?PORT is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      APP_NAME: ${APP_NAME:?APP_NAME is required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Fail-fast opt-out read by packages/auth (auth.ts production mail guard).  
      # Containers receive ONLY injected env - the host .env is never copied
      # into images - so this documented escape hatch must be listed here.
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEV_EMAIL_OVERRIDE: ${DEV_EMAIL_OVERRIDE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Better Auth tuning knobs (documented in .env.example). All optional;
      # packages/auth falls back to built-in defaults when unset.
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      SESSION_EXPIRES_IN: ${SESSION_EXPIRES_IN:-}
      SESSION_UPDATE_AGE: ${SESSION_UPDATE_AGE:-}
      SESSION_FRESH_AGE: ${SESSION_FRESH_AGE:-}
      TWO_FACTOR_TOTP_PERIOD: ${TWO_FACTOR_TOTP_PERIOD:-}
      TWO_FACTOR_OTP_PERIOD: ${TWO_FACTOR_OTP_PERIOD:-}
      TWO_FACTOR_OTP_ATTEMPTS: ${TWO_FACTOR_OTP_ATTEMPTS:-}
      TWO_FACTOR_BACKUP_AMOUNT: ${TWO_FACTOR_BACKUP_AMOUNT:-}
      TWO_FACTOR_BACKUP_LENGTH: ${TWO_FACTOR_BACKUP_LENGTH:-}
      TWO_FACTOR_COOKIE_MAX_AGE: ${TWO_FACTOR_COOKIE_MAX_AGE:-}
      TRUST_DEVICE_MAX_AGE: ${TRUST_DEVICE_MAX_AGE:-}
    expose:
      - '${PORT:?PORT is required}'
    healthcheck:
      # Liveness only (/api/health/live always returns 200 once the process
      # is listening). A strict readiness probe (/api/health/ready, which 503s
      # until Redis+Postgres connect) is dangerous here: busybox wget exits
      # non-zero on 5xx, so the container gets marked unhealthy and every
      # `depends_on: service_healthy` consumer (web, proxy) never starts.
      test:
        [
          'CMD-SHELL',
          'wget -qO- "http://127.0.0.1:$${PORT}/api/health/live" > /dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      app-network:
        aliases:
          - api

  web:
    profiles: ['prod']
    image: template-turbo-web:prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      target: runner
      args:
        TURBO_VERSION: '2.10.10'
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: ${WEB_HOST:?WEB_HOST is required}
      PORT: ${WEB_PORT:?WEB_PORT is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-}
      # Architecture B: the internet-facing tier holds NO database
      # credentials and NO auth signing secret. Server-side auth + domain
      # operations are performed over this internal URL with forwarded
      # cookies; the API tier owns Postgres and BETTER_AUTH_SECRET alone.
      INTERNAL_API_URL: http://api:${PORT:?PORT is required}
    expose:
      - '${WEB_PORT:?WEB_PORT is required}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- "http://127.0.0.1:$${PORT}/" > /dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      app-network:
        aliases:
          - web

  proxy:
    <<: *proxy-base
    profiles: ['prod']
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:?NGINX_SSL_CERT_FILENAME is required}
      NGINX_SSL_KEY_FILENAME: ${NGINX_SSL_KEY_FILENAME:?NGINX_SSL_KEY_FILENAME is required}
      # Real client IP for nginx rate limits. Direct mode now (127.0.0.0/8 no-op);
      # set NGINX_TRUSTED_PROXIES to your LB/CDN CIDRs when one is added later.
      NGINX_TRUSTED_PROXIES: ${NGINX_TRUSTED_PROXIES:-127.0.0.0/8}
      NGINX_REAL_IP_HEADER: ${NGINX_REAL_IP_HEADER:-X-Forwarded-For}
      API_UPSTREAM_HOST: api
      API_UPSTREAM_PORT: ${PORT:?PORT is required}
      WEB_UPSTREAM_HOST: web
      WEB_UPSTREAM_PORT: ${WEB_PORT:?WEB_PORT is required}

  migrate-dev:
    profiles: ['dev']
    image: template-turbo-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    init: true
    command: >
      sh -c "pnpm --filter @repo/database db:generate &&
             pnpm --filter @repo/database db:migrate:deploy"
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    volumes:
      - .:/app
      - root-node_modules:/app/node_modules
      - apps-api-node_modules:/app/apps/api/node_modules
      - apps-web-node_modules:/app/apps/web/node_modules
      - packages-api-node_modules:/app/packages/api/node_modules
      - packages-auth-node_modules:/app/packages/auth/node_modules
      - packages-database-node_modules:/app/packages/database/node_modules
      - packages-eslint-config-node_modules:/app/packages/eslint-config/node_modules
      - packages-tailwind-config-node_modules:/app/packages/tailwind-config/node_modules
      - packages-ui-node_modules:/app/packages/ui/node_modules
    networks:
      app-network:
        aliases:
          - migrate-dev

  api-dev:
    profiles: ['dev']
    image: template-turbo-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    init: true
    command: ['sh', '-c', 'pnpm turbo run dev --filter=api... --no-daemon']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      HOST: ${HOST:?HOST is required}
      PORT: ${PORT:?PORT is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      APP_NAME: ${APP_NAME:?APP_NAME is required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Fail-fast opt-out read by packages/auth (auth.ts production mail guard).
      # Containers receive ONLY injected env - the host .env is never copied
      # into images - so this documented escape hatch must be listed here.
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEV_EMAIL_OVERRIDE: ${DEV_EMAIL_OVERRIDE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Better Auth tuning knobs (see prod api service / .env.example)
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      SESSION_EXPIRES_IN: ${SESSION_EXPIRES_IN:-}
      SESSION_UPDATE_AGE: ${SESSION_UPDATE_AGE:-}
      SESSION_FRESH_AGE: ${SESSION_FRESH_AGE:-}
      TWO_FACTOR_TOTP_PERIOD: ${TWO_FACTOR_TOTP_PERIOD:-}
      TWO_FACTOR_OTP_PERIOD: ${TWO_FACTOR_OTP_PERIOD:-}
      TWO_FACTOR_OTP_ATTEMPTS: ${TWO_FACTOR_OTP_ATTEMPTS:-}
      TWO_FACTOR_BACKUP_AMOUNT: ${TWO_FACTOR_BACKUP_AMOUNT:-}
      TWO_FACTOR_BACKUP_LENGTH: ${TWO_FACTOR_BACKUP_LENGTH:-}
      TWO_FACTOR_COOKIE_MAX_AGE: ${TWO_FACTOR_COOKIE_MAX_AGE:-}
      TRUST_DEVICE_MAX_AGE: ${TRUST_DEVICE_MAX_AGE:-}
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '100'
      TSC_WATCHFILE: UseDynamicPolling
    expose:
      - '${PORT:?PORT is required}'
    ports:
      # Loopback-only: the RFC1918-wide Better Auth trustedProxies would let
      # any LAN peer reaching this port directly spoof X-Forwarded-For (rate-
      # limit evasion, poisoned audit IPs). Host tools still connect via
      # 127.0.0.1; container-to-container traffic uses the app network.
      - '127.0.0.1:${PORT:?PORT is required}:${PORT:?PORT is required}'
    volumes:
      - .:/app
      - root-node_modules:/app/node_modules
      - apps-api-node_modules:/app/apps/api/node_modules
      - apps-web-node_modules:/app/apps/web/node_modules
      - packages-api-node_modules:/app/packages/api/node_modules
      - packages-auth-node_modules:/app/packages/auth/node_modules
      - packages-database-node_modules:/app/packages/database/node_modules
      - packages-eslint-config-node_modules:/app/packages/eslint-config/node_modules
      - packages-tailwind-config-node_modules:/app/packages/tailwind-config/node_modules
      - packages-ui-node_modules:/app/packages/ui/node_modules
      - api-turbo:/app/.turbo
    healthcheck:
      test:
        [
          # /api itself is a 404 (global prefix, no root route) - probe the
          # anonymous liveness endpoint like the prod api service does.
          'CMD-SHELL',
          'wget -qO- "http://127.0.0.1:$${PORT}/api/health/live" > /dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      app-network:
        aliases:
          - api-dev

  web-dev:
    profiles: ['dev']
    image: template-turbo-web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    init: true
    command: ['sh', '-c', 'pnpm turbo run dev --filter=web... --no-daemon']
    depends_on:
      # Architecture B: web talks only to the API (no direct DB/Redis)
      api-dev:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      HOSTNAME: ${WEB_HOST:?WEB_HOST is required}
      PORT: ${WEB_PORT:?WEB_PORT is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-}
      INTERNAL_API_URL: http://api-dev:${PORT:?PORT is required}
      # Architecture B: no DB credentials / signing secret / auth URL in the
      # web tier (dev profile matches prod exactly). The SSR fallback in
      # auth-client.ts resolves from NEXT_PUBLIC_APP_URL.
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '100'
      WATCHPACK_POLLING: 'true'
    expose:
      - '${WEB_PORT:?WEB_PORT is required}'
    ports:
      # Loopback-only (see api-dev rationale: direct XFF spoofing + the dev
      # server is meant to be reached through the nginx proxy anyway).
      - '127.0.0.1:${WEB_PORT:?WEB_PORT is required}:${WEB_PORT:?WEB_PORT is required}'
    volumes:
      - .:/app
      - root-node_modules:/app/node_modules
      - apps-api-node_modules:/app/apps/api/node_modules
      - apps-web-node_modules:/app/apps/web/node_modules
      - packages-api-node_modules:/app/packages/api/node_modules
      - packages-auth-node_modules:/app/packages/auth/node_modules
      - packages-database-node_modules:/app/packages/database/node_modules
      - packages-eslint-config-node_modules:/app/packages/eslint-config/node_modules
      - packages-tailwind-config-node_modules:/app/packages/tailwind-config/node_modules
      - packages-ui-node_modules:/app/packages/ui/node_modules
      - web-turbo:/app/.turbo
      - web-next:/app/apps/web/.next
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- "http://127.0.0.1:$${PORT}/" > /dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      app-network:
        aliases:
          - web-dev

  proxy-dev:
    <<: *proxy-base
    profiles: ['dev']
    depends_on:
      api-dev:
        condition: service_healthy
      web-dev:
        condition: service_healthy
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:?NGINX_SSL_CERT_FILENAME is required}
      NGINX_SSL_KEY_FILENAME: ${NGINX_SSL_KEY_FILENAME:?NGINX_SSL_KEY_FILENAME is required}
      # Real client IP for nginx rate limits. Direct mode now (127.0.0.0/8 no-op);
      # set NGINX_TRUSTED_PROXIES to your LB/CDN CIDRs when one is added later.
      NGINX_TRUSTED_PROXIES: ${NGINX_TRUSTED_PROXIES:-127.0.0.0/8}
      NGINX_REAL_IP_HEADER: ${NGINX_REAL_IP_HEADER:-X-Forwarded-For}
      API_UPSTREAM_HOST: api-dev
      API_UPSTREAM_PORT: ${PORT:?PORT is required}
      WEB_UPSTREAM_HOST: web-dev
      WEB_UPSTREAM_PORT: ${WEB_PORT:?WEB_PORT is required}

  proxy-local:
    <<: *proxy-base
    profiles: ['local']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:?NGINX_SSL_CERT_FILENAME is required}
      NGINX_SSL_KEY_FILENAME: ${NGINX_SSL_KEY_FILENAME:?NGINX_SSL_KEY_FILENAME is required}
      # Real client IP for nginx rate limits. Direct mode now (127.0.0.0/8 no-op);
      # set NGINX_TRUSTED_PROXIES to your LB/CDN CIDRs when one is added later.
      NGINX_TRUSTED_PROXIES: ${NGINX_TRUSTED_PROXIES:-127.0.0.0/8}
      NGINX_REAL_IP_HEADER: ${NGINX_REAL_IP_HEADER:-X-Forwarded-For}
      API_UPSTREAM_HOST: host.docker.internal
      API_UPSTREAM_PORT: ${PORT:?PORT is required}
      WEB_UPSTREAM_HOST: host.docker.internal
      WEB_UPSTREAM_PORT: ${WEB_PORT:?WEB_PORT is required}

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  root-node_modules:
  apps-api-node_modules:
  apps-web-node_modules:
  packages-api-node_modules:
  packages-auth-node_modules:
  packages-database-node_modules:
  packages-eslint-config-node_modules:
  packages-tailwind-config-node_modules:
  packages-ui-node_modules:
  api-turbo:
  web-turbo:
  web-next:
