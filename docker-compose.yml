x-proxy-base: &proxy-base
  image: nginx:1.27-alpine
  restart: unless-stopped
  command:
    [
      '/bin/sh',
      '-c',
      'sh /opt/nginx/entrypoint.sh && exec nginx -g "daemon off;"',
    ]
  environment:
    NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
    NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:?NGINX_SSL_CERT_FILENAME is required}
    NGINX_SSL_KEY_FILENAME: ${NGINX_SSL_KEY_FILENAME:?NGINX_SSL_KEY_FILENAME is required}
  ports:
    - '${PROXY_HTTP_PORT:?PROXY_HTTP_PORT is required}:80'
    - '${PROXY_HTTPS_PORT:?PROXY_HTTPS_PORT is required}:443'
  volumes:
    - ./nginx/nginx.conf:/opt/nginx/nginx.conf.template:ro
    - ./nginx/entrypoint.sh:/opt/nginx/entrypoint.sh:ro
    - ./nginx/certs:/etc/nginx/certs:ro
  healthcheck:
    test:
      ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1']
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 15s
  networks:
    app-network:
      aliases:
        - proxy

services:
  postgres:
    profiles: ['prod', 'dev']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    expose:
      - '5432'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      app-network:
        aliases:
          - postgres

  redis:
    profiles: ['prod', 'dev']
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - '6379'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      app-network:
        aliases:
          - redis

  pgadmin:
    profiles: ['prod', 'dev']
    image: dpage/pgadmin4:8.11
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    expose:
      - '80'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - pgadmin

  migrate:
    profiles: ['prod']
    image: template-turbo-migrate:prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
      target: migrator
      args:
        TURBO_VERSION: '2.10.10'
        DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    networks:
      app-network:
        aliases:
          - migrate

  api:
    profiles: ['prod']
    image: template-turbo-api:prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
      target: runner
      args:
        TURBO_VERSION: '2.10.10'
        DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: ${API_HOST:?API_HOST is required}
      PORT: ${API_PORT:?API_PORT is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      APP_NAME: ${APP_NAME:-MyApp}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEV_EMAIL_OVERRIDE: ${DEV_EMAIL_OVERRIDE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    expose:
      - '${API_PORT:?API_PORT is required}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- "http://127.0.0.1:$${PORT}/api" > /dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      app-network:
        aliases:
          - api

  web:
    profiles: ['prod']
    image: template-turbo-web:prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      target: runner
      args:
        TURBO_VERSION: '2.10.10'
        DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: ${WEB_HOST:?WEB_HOST is required}
      PORT: ${WEB_PORT:?WEB_PORT is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-}
      INTERNAL_API_URL: http://api:${API_PORT:?API_PORT is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    expose:
      - '${WEB_PORT:?WEB_PORT is required}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- "http://127.0.0.1:$${PORT}/" > /dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      app-network:
        aliases:
          - web

  proxy:
    <<: *proxy-base
    profiles: ['prod']
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:?NGINX_SSL_CERT_FILENAME is required}
      NGINX_SSL_KEY_FILENAME: ${NGINX_SSL_KEY_FILENAME:?NGINX_SSL_KEY_FILENAME is required}
      API_UPSTREAM_HOST: api
      API_UPSTREAM_PORT: ${API_PORT:?API_PORT is required}
      WEB_UPSTREAM_HOST: web
      WEB_UPSTREAM_PORT: ${WEB_PORT:?WEB_PORT is required}

  api-dev:
    profiles: ['dev']
    image: template-turbo-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    init: true
    command: >
      sh -c "pnpm install --frozen-lockfile --store-dir /pnpm/store &&
             pnpm --filter @repo/database db:generate &&
             pnpm turbo run dev --filter=api... --no-daemon"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PNPM_NODE_LINKER: hoisted
      HOST: ${API_HOST:?API_HOST is required}
      PORT: ${API_PORT:?API_PORT is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      APP_NAME: ${APP_NAME:-MyApp}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEV_EMAIL_OVERRIDE: ${DEV_EMAIL_OVERRIDE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '100'
      WATCHPACK_POLLING: 'true'
      TSC_WATCHFILE: UseDynamicPolling
    expose:
      - '${API_PORT:?API_PORT is required}'
    volumes:
      - .:/app
      - api-node_modules:/app/node_modules
      - api-pnpm-store:/pnpm/store
      - api-turbo:/app/.turbo
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- "http://127.0.0.1:$${PORT}/" > /dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      app-network:
        aliases:
          - api-dev

  web-dev:
    profiles: ['dev']
    image: template-turbo-web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    init: true
    command: >
      sh -c "pnpm install --frozen-lockfile --store-dir /pnpm/store &&
             pnpm --filter @repo/database db:generate &&
             pnpm turbo run dev --filter=web... --no-daemon"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-dev:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PNPM_NODE_LINKER: hoisted
      HOSTNAME: ${WEB_HOST:?WEB_HOST is required}
      PORT: ${WEB_PORT:?WEB_PORT is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:?NEXT_ALLOWED_DEV_ORIGINS is required}
      INTERNAL_API_URL: http://api-dev:${API_PORT:?API_PORT is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '100'
      WATCHPACK_POLLING: 'true'
    expose:
      - '${WEB_PORT:?WEB_PORT is required}'
    volumes:
      - .:/app
      - web-node_modules:/app/node_modules
      - web-pnpm-store:/pnpm/store
      - web-turbo:/app/.turbo
      - web-next:/app/apps/web/.next
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- "http://127.0.0.1:$${PORT}/" > /dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      app-network:
        aliases:
          - web-dev

  proxy-dev:
    <<: *proxy-base
    profiles: ['dev']
    depends_on:
      api-dev:
        condition: service_healthy
      web-dev:
        condition: service_healthy
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:?NGINX_SSL_CERT_FILENAME is required}
      NGINX_SSL_KEY_FILENAME: ${NGINX_SSL_KEY_FILENAME:?NGINX_SSL_KEY_FILENAME is required}
      API_UPSTREAM_HOST: api-dev
      API_UPSTREAM_PORT: ${API_PORT:?API_PORT is required}
      WEB_UPSTREAM_HOST: web-dev
      WEB_UPSTREAM_PORT: ${WEB_PORT:?WEB_PORT is required}

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  api-node_modules:
  api-pnpm-store:
  api-turbo:
  web-node_modules:
  web-pnpm-store:
  web-turbo:
  web-next:
