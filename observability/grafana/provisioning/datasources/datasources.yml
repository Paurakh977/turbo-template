apiVersion: 1

datasources:
  # ─── Prometheus (Metrics) ──────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
      timeInterval: '15s'

  # ─── Loki (Logs) ──────────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # Match both traceid (OTLP) and trace_id (pino) in log JSON
        - datasourceUid: tempo
          matcherRegex: '"trace_?id"\s*:\s*"(\w+)"'
          name: TraceID
          url: '$${__value.raw}'
          urlDisplayLabel: 'Open in Tempo'

  # ─── Tempo (Traces) ───────────────────────────────────────────────────
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        # Query Loki for logs matching this trace ID
        query: '{job="turbo-template/api"} | traceid="$${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        tags:
          - key: service.name
            value: job
        queries:
          - name: 'Request Rate'
            query: 'sum(rate(http_server_requests_total{job=~"$${__tags.job}"}[5m])) by (route)'
          - name: 'Error Rate'
            query: 'sum(rate(http_server_errors_total{job=~"$${__tags.job}"}[5m])) by (route, error_type)'
          - name: 'Latency P95'
            query: 'histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{job=~"$${__tags.job}"}[5m])) by (le, route))'
      tracesToProfiles:
        datasourceUid: pyroscope
        tags:
          - key: service.name
            value: service_name
        profileTypeId: 'process_cpu:cpu:nanoseconds:cpu:nanoseconds'
        customQuery: true
        query: '{service_name="$${__tags.service.name}"}'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      traceQuery:
        timeShiftEnabled: false
      cache:
        enabled: false

  # ─── Pyroscope (Profiles) ─────────────────────────────────────────────
  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    access: proxy
    url: http://pyroscope:4040
