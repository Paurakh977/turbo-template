groups:
  - name: redis
    rules:
      - alert: RedisMemoryExhaustion
        # clamp_min guards ÷0 — redis_memory_max_bytes is 0 when no
        # maxmemory policy is set (our prod default until REDIS_MAXMEMORY
        # lands; see .env.example). Without the clamp the rule evaluates
        # +Inf/NaN and pages spuriously on every fresh Redis.
        expr: redis_memory_used_bytes / clamp_min(redis_memory_max_bytes, 1) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis memory above 90% of max"

      - alert: RedisHighEvictionRate
        expr: rate(redis_evicted_keys_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis evicting keys at high rate"

      - alert: RedisTooManyClients
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis has {{ $value }} connected clients"
