name: E2E Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: e2e
    steps:
      - uses: actions/checkout@v4

      # No `version:` pin here on purpose — reading the root `packageManager`
      # field is the single source of truth. A hardcoded `version: 9` silently
      # disagreed with the repo's pnpm 11 and was the reason this workflow was
      # not equivalent to CI.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/database db:generate

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start E2E stack (nginx + api + web + postgres + redis)
        run: docker compose --env-file .env.e2e --profile e2e up -d --build

      - name: Run Playwright E2E
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose --env-file .env.e2e --profile e2e down -v
