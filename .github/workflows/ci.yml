name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · build · test · guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in root package.json (packageManager)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Enforces the @repo/auth import fence. eslint cannot enforce it:
      # eslint-plugin-only-warn downgrades every error to a warning at the
      # Linter level, so a fenced rule can never fail `turbo lint`. Needs no
      # build — run right after install so violations fail fastest.
      - name: Guard - web imports no @repo/auth runtime root
        run: pnpm guard:web-auth-imports

      # The generated Prisma client is gitignored; builds depend on it.
      - name: Generate Prisma client
        run: pnpm --filter @repo/database db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_NAME: Ozon CI
          EMAIL_FROM: noreply@example.com

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      # Enforces Architecture B: the web tier must carry zero references to
      # DB credentials (they were removed in the Phase 2 commit).
      - name: Guard - web bundle carries no DB secrets
        run: node scripts/check-web-secrets.mjs --strict
