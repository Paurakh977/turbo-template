[databases]
; Target: the compose-internal postgres hostname.
; DATABASE_NAME is interpolated at container start from the environment (see
; docker-compose.yml pgbouncer service env block). PgBouncer reads this file
; with envsubst-style substitution via edoburu/pgbouncer's entrypoint.
*= host=postgres port=5432

[pgbouncer]
; ── Mode ──────────────────────────────────────────────────────────────────────
; Transaction mode: each server connection is returned to the pool after every
; COMMIT/ROLLBACK rather than held for the entire client connection lifetime.
; This maximises server-connection multiplexing for Prisma's short query bursts.
;
; Prepared-statement support: pgbouncer 1.22+ with max_prepared_statements > 0
; allows named prepared statements in transaction mode by tracking them per
; server connection. Prisma's PgAdapter uses extended query protocol (prepared
; statements) — without this, queries fail with "prepared statement ... already
; exists" when the statement runs on a different server connection.
pool_mode = transaction
max_prepared_statements = 200

; ── Pool sizing ───────────────────────────────────────────────────────────────
; Values here are the template fallback; compose env (PGBOUNCER_*) takes
; precedence in the edoburu image. Keep all three sources aligned:
; .env.example (500/25/10/5) is canonical.
; max_client_conn: total client-side connections PgBouncer will accept.
max_client_conn = 500

; default_pool_size: server connections PgBouncer opens toward PostgreSQL.
;   Sizing rule (P1): keep default_pool_size + reserve_pool_size comfortably
;   BELOW POSTGRES_MAX_CONNECTIONS (env-driven, default 200 — see .env.example).
;   25 + reserve 5 = 30 peak, leaving room for postgres-exporter, migrate and
;   direct psql. Evidence: raising pools to 100/70 made 1k-RPS throughput WORSE
;   (IO-bound, not conn-bound), so do not grow these without benchmark proof.
default_pool_size = 25

; min_pool_size: keep N server connections warm to absorb sudden bursts without
;   the latency of a fresh TLS+auth handshake to Postgres.
min_pool_size = 10

; reserve_pool_size: extra connections allowed when all pool slots are busy,
;   giving a small burst absorber while pool saturation alerts fire.
reserve_pool_size = 5
reserve_pool_timeout = 2

; ── Timeouts ──────────────────────────────────────────────────────────────────
; server_idle_timeout: release a server connection back to Postgres after 600s
;   of inactivity, avoiding repeated connection rebuild churn.
server_idle_timeout = 600

; server_connect_timeout: fail fast if Postgres is unreachable.
server_connect_timeout = 10

; client_idle_timeout: 0 disables client idle disconnection. Application pools
;   (Node.js pg.Pool) manage their own idle connection lifecycle safely.
client_idle_timeout = 0

; query_wait_timeout: if a query waits for a server connection for this long,
;   return an error rather than queueing indefinitely.
query_wait_timeout = 15

; ── Auth ──────────────────────────────────────────────────────────────────────
; scram-sha-256: PostgreSQL 16 default authentication method.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ── Logging ───────────────────────────────────────────────────────────────────
log_connections = 0
log_disconnections = 0
; log_pooler_errors = 1 (default) keeps error visibility without connection spam.

; ── Admin ─────────────────────────────────────────────────────────────────────
; Bind only to the container-internal interface; never expose the admin console
; to the app-network or the host.
admin_users = pgbouncer_admin
stats_users = myapp
listen_addr = 0.0.0.0
listen_port = 6432
