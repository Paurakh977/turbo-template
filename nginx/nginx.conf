worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Real client IP (direct now, LB/CDN later) ───────────────────────────
  # Generated by entrypoint.sh from NGINX_TRUSTED_PROXIES. When nothing is in
  # front of nginx the default (127.0.0.0/8) never matches a real client, so
  # $binary_remote_addr stays the true peer. When a LB/CDN is added later,
  # set NGINX_TRUSTED_PROXIES to its CIDRs and nginx restores the real IP —
  # which also corrects the limit_req/limit_conn buckets below.
  include /etc/nginx/realip.conf;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  log_format json_analytics escape=json '{'
    '"time_local":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"real_ip":"$realip_remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"traceparent":"$http_traceparent"'
  '}';

  access_log /var/log/nginx/access.log json_analytics;
  error_log /var/log/nginx/error.log warn;

  # WebSocket-aware Connection header for `location /`.
  # Plain requests (no Upgrade header) MUST send an empty Connection header:
  # with `proxy_http_version 1.1` that is what keeps upstream connections in
  # the `keepalive 64` pool. The old `'' close` value forced a fresh TCP (+TLS)
  # handshake on every non-WebSocket page/API request to Next.js, idling the
  # keepalive pool entirely. `upgrade` is only sent for real WS handshakes.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # ── Layered rate limiting architecture ─────────────────────────────────
  #
  #   Layer 1 (nginx):       IP-wide flood protection  (this file)
  #   Layer 2 (Better Auth): Per-endpoint per-user/IP  (packages/auth/src/auth.ts)
  #   Layer 3 (Server Action): DB-backed per-action    (apps/web/src/lib/server-action-rate-limit.ts)
  #
  # Nginx limits must be >= the aggregate app-level limits a single IP could
  # hit. Nginx is the outermost shield — it catches connection floods,
  # while Better Auth provides fine-grained per-endpoint protection.
  #
  # No bypass header: any client-controlled bypass (e.g. X-Bypass-Rate-Limit)
  # maps to an empty limit_req key, and nginx documents that "requests with an
  # empty key value are not accounted for" — i.e. unlimited. k6 load tests run
  # WITHOUT a bypass and treat 429 as expected behavior (see k6/config.js
  # thresholds, spike.js); the dedicated rate-limit scenario asserts 429s fire.
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=300r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

  # Concurrent-connection cap per real IP (slowloris / connection-exhaustion
  # protection). Complements the request-rate limits above.
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  client_max_body_size 10m;
  client_body_buffer_size 128k;

  proxy_buffering on;
  proxy_buffers 8 16k;
  proxy_buffer_size 16k;
  proxy_busy_buffers_size 24k;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;

  upstream nextjs_client {
    server ${WEB_UPSTREAM_HOST}:${WEB_UPSTREAM_PORT};
    keepalive 64;
  }

  upstream nestjs_api {
    server ${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
    keepalive 64;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name ${NGINX_SERVER_NAME};

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${NGINX_SERVER_NAME};

    # Concurrent-connection cap per real IP (slowloris / exhaustion protection).
    # Defined once at server level so it applies to every location below.
    # Value injected from NGINX_CONN_LIMIT (default 20) via entrypoint.sh placeholder.
    limit_conn conn_limit NGINX_CONN_LIMIT_PLACEHOLDER;

    ssl_certificate /etc/nginx/certs/${NGINX_SSL_CERT_FILENAME};
    ssl_certificate_key /etc/nginx/certs/${NGINX_SSL_KEY_FILENAME};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # No Content-Security-Policy here by design: apps/web/src/proxy.ts is the
    # single CSP owner (per-request nonce + 'strict-dynamic', dynamic
    # connect-src for API/Faro origins). Browsers enforce EVERY CSP header
    # independently (intersection = most restrictive wins), so a second static
    # nginx CSP — e.g. `connect-src 'self'` — would silently override the
    # proxy's cross-origin allowances and break Faro/API beacons with no log
    # on either side. Other headers above are safe to layer (no intersection).

    location = /healthz {
      access_log off;
      # NOTE: this location defines its OWN add_header, so nginx does NOT
      # inherit the security headers added above in this server block
      # (X-Frame-Options, HSTS, etc.) for /healthz responses. Intentional for
      # bare health probes — but if you ever need the security headers here
      # too, move them into a shared include or repeat them in this location.
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Generic 429 for nginx-level rate/connection limits (used by /api/ and /).
    # /api/auth/ deliberately omits this so Better Auth's own 429s are kept.
    location @ratelimited {
      add_header Retry-After "10" always;
      default_type application/json;
      return 429 '{"error":"too_many_requests","message":"Rate limit exceeded. Please retry later."}';
    }

    # Faro RUM telemetry collection (browser -> Alloy)
    # NOTE: alloy lives in docker-compose.observability.yml, NOT this file's
    # stack — so it must be resolved at REQUEST time via a variable + resolver.
    # A static `proxy_pass http://alloy:12347` resolves at STARTUP: without the
    # observability file (or in profiles without alloy, e.g. e2e) nginx exits
    # `[emerg] host not found` and the whole proxy crash-loops. With the
    # variable form only /collect 502s when alloy is absent; everything else
    # keeps serving. Docker embedded DNS is always 127.0.0.11 for compose
    # networks (the proxy only ever runs as a compose service).
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;
    location /collect {
      # Telemetry collection IS rate-limited: unauthenticated browsers hit
      # this endpoint, so an open proxy_pass lets anyone flood Alloy → Loki /
      # Tempo with junk (CPU, log volume, disk). 30r/s + burst 50 per IP is
      # far above legitimate Faro batching (page-load + periodic beacons)
      # while capping abuse. Rejected beacons return the shared JSON 429
      # with Retry-After so well-behaved SDKs back off.
      limit_req zone=general_limit burst=50 nodelay;
      error_page 429 = @ratelimited;
      # Faro only ever sends POST (beacons) + OPTIONS (CORS preflight).
      # Reject everything else at the edge instead of proxying it to Alloy.
      limit_except POST OPTIONS {
        deny all;
      }
      # Faro batches are KBs of JSON; don't accept 10m bodies here.
      client_max_body_size 1m;
      set $alloy_upstream alloy:12347;
      proxy_pass http://$alloy_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # CORS for browser telemetry
      # NOTE: "*" is intentional local-only open mode (matches Alloy FARO_CORS_ORIGINS=*).
      # Restrict to app domain(s) in production alongside Alloy FARO_CORS_ORIGINS.
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;

      # Handle preflight — include CORS headers in the 204 response
      if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Content-Length 0;
        return 204;
      }
    }

    location /api/auth/ {
      limit_req zone=auth_limit burst=10;
      proxy_pass http://nestjs_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header traceparent $http_traceparent;
      proxy_set_header tracestate $http_tracestate;
      proxy_set_header baggage $http_baggage;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # Health probes: never throttled by rate limiting
    location /api/health/ {
      proxy_pass http://nestjs_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header traceparent $http_traceparent;
      proxy_set_header tracestate $http_tracestate;
      proxy_set_header baggage $http_baggage;
      proxy_connect_timeout 5s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      # Return a clean 429 with Retry-After (do NOT add this to /api/auth/,
      # so Better Auth's own 429 responses pass through unmodified).
      error_page 429 = @ratelimited;
      proxy_pass http://nestjs_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header traceparent $http_traceparent;
      proxy_set_header tracestate $http_tracestate;
      proxy_set_header baggage $http_baggage;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location / {
      limit_req zone=general_limit burst=50 nodelay;
      error_page 429 = @ratelimited;
      proxy_pass http://nextjs_client;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header traceparent $http_traceparent;
      proxy_set_header tracestate $http_tracestate;
      proxy_set_header baggage $http_baggage;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
